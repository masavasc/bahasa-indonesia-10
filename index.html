<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bahasa 10">
<title>Bahasa Indonesia 10</title>
<style>
:root{
  --bg:#f4f2ec;
  --card:#ffffff;
  --text:#202020;
  --sub:#666666;
  --accent:#b03a2e;
  --blue:#1e88f5;
  --line:#d9d4c8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;
}
body{
  padding:14px 14px calc(24px + env(safe-area-inset-bottom));
}
.wrap{
  max-width:720px;
  margin:0 auto;
}
h1{
  font-size:21px;
  font-weight:800;
  margin:2px 4px 2px;
  line-height:1.2;
}
.lead{
  color:var(--sub);
  font-size:12px;
  margin:0 4px 12px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
button{
  width:100%;
  border:1.5px solid var(--line);
  background:linear-gradient(to bottom, #ffffff 0%, #fcfcfa 100%);
  border-radius:18px;
  min-height:102px;
  padding:12px 10px;
  text-align:center;
  cursor:pointer;
  touch-action:manipulation;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.9) inset,
    0 2px 4px rgba(0,0,0,0.06),
    0 8px 16px rgba(0,0,0,0.04);
}
button:active{
  transform:translateY(1px) scale(.99);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.7) inset,
    0 2px 6px rgba(0,0,0,0.05);
}
.word{
  display:block;
  color:var(--blue);
  font-size:19px;
  font-weight:780;
  line-height:1.15;
}
.reading{
  display:block;
  color:var(--accent);
  font-size:14px;
  font-weight:700;
  margin-top:6px;
  line-height:1.2;
}
.meaning{
  display:block;
  color:#5f5f5f;
  font-size:16px;
  font-weight:650;
  margin-top:8px;
  line-height:1.25;
}
@media (max-width:390px){
  h1{font-size:20px}
  .lead{font-size:11px}
  button{
    min-height:96px;
    padding:11px 8px;
    border-radius:16px;
  }
  .word{font-size:17px}
  .reading{font-size:13px}
  .meaning{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Bahasa Indonesia 10</h1>
  <p class="lead">タップで発音</p>

  <div class="grid">
    <button type="button" onclick="speak('Terima kasih')">
      <span class="word">Terima kasih</span>
      <span class="reading">トゥリマ・カシ</span>
      <span class="meaning">ありがとう</span>
    </button>

    <button type="button" onclick="speak('Permisi')">
      <span class="word">Permisi</span>
      <span class="reading">プルミシ</span>
      <span class="meaning">すみません／失礼します</span>
    </button>

    <button type="button" onclick="speak('Tolong')">
      <span class="word">Tolong</span>
      <span class="reading">トロン</span>
      <span class="meaning">お願いします</span>
    </button>

    <button type="button" onclick="speak('Berapa')">
      <span class="word">Berapa?</span>
      <span class="reading">ブラパ？</span>
      <span class="meaning">いくら？／いくつ？</span>
    </button>

    <button type="button" onclick="speak('Ini')">
      <span class="word">Ini</span>
      <span class="reading">イニ</span>
      <span class="meaning">これ</span>
    </button>

    <button type="button" onclick="speak('Enak')">
      <span class="word">Enak</span>
      <span class="reading">エナッ</span>
      <span class="meaning">おいしい</span>
    </button>

    <button type="button" onclick="speak('Nasi')">
      <span class="word">Nasi</span>
      <span class="reading">ナシ</span>
      <span class="meaning">ご飯</span>
    </button>

    <button type="button" onclick="speak('Campur')">
      <span class="word">Campur</span>
      <span class="reading">チャンプル</span>
      <span class="meaning">混ぜる／混ぜたもの</span>
    </button>

    <button type="button" onclick="speak('Makan')">
      <span class="word">Makan</span>
      <span class="reading">マカン</span>
      <span class="meaning">食べる／食事</span>
    </button>

    <button type="button" onclick="speak('Tidak')">
      <span class="word">Tidak</span>
      <span class="reading">ティダッ</span>
      <span class="meaning">いいえ／〜ではない</span>
    </button>
  </div>
</div>

<script>
function speak(text){
  if (!('speechSynthesis' in window)) {
    alert('この画面では音声再生を利用できません。Safariで開いてください。');
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'id-ID';
  utterance.rate = 0.8;
  const voices = window.speechSynthesis.getVoices();
  const voice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('id'));
  if (voice) utterance.voice = voice;
  window.speechSynthesis.speak(utterance);
}
</script>
</body>
</html>
