<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bahasa 12">
<meta name="theme-color" content="#845837">
<title>Bahasa Indonesia 12</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{
  --bg:#f4f2ec;
  --card:#ffffff;
  --text:#202020;
  --sub:#5f5f5f;
  --accent:#b03a2e;
  --blue:#1478d4;
  --line:#cfc9bd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;
}
body{
  padding:calc(8px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
}
.wrap{max-width:720px;margin:0 auto}
h1{
  font-size:20px;
  font-weight:800;
  margin:0 3px 1px;
  line-height:1.15;
}
.lead{
  color:#747474;
  font-size:11px;
  margin:0 3px 8px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
button{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  min-height:91px;
  padding:10px 7px;
  border:1.5px solid var(--line);
  border-radius:16px;
  background:linear-gradient(to bottom,#ffffff 0%,#fcfbf8 100%);
  text-align:center;
  cursor:pointer;
  touch-action:manipulation;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    0 2px 4px rgba(0,0,0,.08),
    0 6px 12px rgba(0,0,0,.04);
}
button:active{
  transform:translateY(1px) scale(.99);
  background:#faf8f3;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    0 1px 3px rgba(0,0,0,.07);
}
.word{
  display:block;
  color:var(--blue);
  font-size:17px;
  font-weight:800;
  line-height:1.12;
}
.reading{
  display:block;
  color:var(--accent);
  font-size:13px;
  font-weight:700;
  margin-top:5px;
  line-height:1.15;
}
.meaning{
  display:block;
  color:var(--sub);
  font-size:15px;
  font-weight:650;
  margin-top:6px;
  line-height:1.2;
}
button.long .word{font-size:15px}
button.long .reading{font-size:12px}
button.long .meaning{font-size:14px}

@media (max-width:390px){
  body{padding-left:9px;padding-right:9px}
  .grid{gap:7px}
  button{
    min-height:88px;
    padding:8px 6px;
    border-radius:15px;
  }
  .word{font-size:16px}
  .reading{font-size:12px;margin-top:4px}
  .meaning{font-size:14px;margin-top:5px}
  button.long .word{font-size:14px}
  button.long .reading{font-size:11px}
  button.long .meaning{font-size:13px}
}
</style>
</head>

<body>
<div class="wrap">
  <h1>Bahasa Indonesia 12</h1>
  <p class="lead">タップで発音</p>

  <div class="grid">

    <button type="button" onclick="speak('Selamat pagi')">
      <span class="word">Selamat pagi</span>
      <span class="reading">スラマッ・パギ</span>
      <span class="meaning">おはようございます</span>
    </button>

    <button type="button" onclick="speak('Selamat siang')">
      <span class="word">Selamat siang</span>
      <span class="reading">スラマッ・シアン</span>
      <span class="meaning">こんにちは</span>
    </button>

    <button type="button" onclick="speak('Selamat malam')">
      <span class="word">Selamat malam</span>
      <span class="reading">スラマッ・マラム</span>
      <span class="meaning">こんばんは</span>
    </button>

    <button type="button" onclick="speak('Terima kasih')">
      <span class="word">Terima kasih</span>
      <span class="reading">トゥリマ・カシ</span>
      <span class="meaning">ありがとう</span>
    </button>

    <button type="button" onclick="speak('Permisi')">
      <span class="word">Permisi</span>
      <span class="reading">プルミシ</span>
      <span class="meaning">すみません／失礼します</span>
    </button>

    <button type="button" onclick="speak('Tolong')">
      <span class="word">Tolong</span>
      <span class="reading">トロン</span>
      <span class="meaning">お願いします</span>
    </button>

    <button class="long" type="button" onclick="speak('Mohon bantuannya')">
      <span class="word">Mohon bantuannya</span>
      <span class="reading">モホン・バントゥアンニャ</span>
      <span class="meaning">よろしくお願いします</span>
    </button>

    <button type="button" onclick="speak('Ini berapa')">
      <span class="word">Ini berapa?</span>
      <span class="reading">イニ・ブラパ？</span>
      <span class="meaning">これはいくらですか？</span>
    </button>

    <button type="button" onclick="speak('Enak')">
      <span class="word">Enak</span>
      <span class="reading">エナッ</span>
      <span class="meaning">おいしい</span>
    </button>

    <button type="button" onclick="speak('Minta bill, ya')">
      <span class="word">Minta bill, ya.</span>
      <span class="reading">ミンタ・ビル・ヤ</span>
      <span class="meaning">お勘定をお願いします</span>
    </button>

    <button class="long" type="button" onclick="speak('Bisa bayar pakai kartu')">
      <span class="word">Bisa bayar pakai kartu?</span>
      <span class="reading">ビサ・バヤール・パカイ・カルトゥ？</span>
      <span class="meaning">カードは使えますか？</span>
    </button>

    <button type="button" onclick="speak('Tidak')">
      <span class="word">Tidak</span>
      <span class="reading">ティダッ</span>
      <span class="meaning">いいえ／〜ではない</span>
    </button>

  </div>
</div>

<script>
function speak(text){
  if (!('speechSynthesis' in window)) {
    alert('この画面では音声再生を利用できません。Safariで開いてください。');
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'id-ID';
  utterance.rate = 0.8;
  utterance.pitch = 1.0;

  const voices = window.speechSynthesis.getVoices();
  const voice = voices.find(v =>
    v.lang && v.lang.toLowerCase().startsWith('id')
  );

  if (voice) utterance.voice = voice;
  window.speechSynthesis.speak(utterance);
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}
</script>

</body>
</html>
